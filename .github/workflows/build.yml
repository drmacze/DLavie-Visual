name: Build DLavie Visual
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow numpy
      - name: Static syntax checks
        run: |
          python -m py_compile tools/*.py
          bash -n tools/build.sh
      - name: Build and full runtime audit
        run: |
          chmod +x tools/build.sh
          ./tools/build.sh
      - name: Reproducibility check
        run: |
          cp dist/DLavie-Visual.mcpack /tmp/DLavie-Visual-first.mcpack
          ./tools/build.sh
          cmp /tmp/DLavie-Visual-first.mcpack dist/DLavie-Visual.mcpack
          sha256sum dist/DLavie-Visual.mcpack
      - uses: actions/upload-artifact@v4
        with:
          name: DLavie-Visual-mcpack
          path: dist/DLavie-Visual.mcpack
